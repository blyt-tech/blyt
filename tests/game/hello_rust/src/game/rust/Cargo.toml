[package]
name = "hello_rust"
version = "0.1.0"
edition = "2021"
publish = false

# blyt build compiles this as a staticlib and links it into the cart ELF.
[lib]
crate-type = ["staticlib"]

# blyt build injects the SDK crate path via --config at build time.
# The version constraint is intentionally loose; the injected path overrides it.
[dependencies]
blyt = "0.1"
