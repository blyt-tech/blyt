# nextest configuration (local runs and CI).

[profile.default]
# Flakes and missing prerequisites must fail loudly — never auto-retry
# (explicit: this is the repo's missing-prereqs-are-failures policy).
retries = 0
# With suites running in parallel, a failure printed mid-run can scroll away
# behind interleaved progress lines; re-print every failure's full output at
# the end of the run as well.
failure-output = "immediate-final"

# The QEMU gate boots a full system over SSH (~25-35s, the longest single
# test). Schedule it first so it overlaps the other suites instead of
# extending the run when it lands at the tail of the queue.
[[profile.default.overrides]]
filter = 'test(native_riscv_qemu_gate)'
priority = 100
