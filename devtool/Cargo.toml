[package]
name = "blyt"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
flatbuffers = "25.12.19"
globset = "0.4"
notify = "8"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
unicode-normalization = "0.1"
tungstenite = "0.24"
zstd = "0.13"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
