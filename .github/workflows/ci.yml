name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux-x86-64:
    name: Linux x86-64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsdl2-dev lld llvm
          pip3 install clang-format==22.1.5 cmakelang yamllint

      - name: Check formatting
        run: |
          clang-format --dry-run --Werror \
            src/libblyt/*.h src/libblyt/*.c \
            include/*.h \
            tests/unit/*.c \
            tests/tools/*.c \
            frontends/sdl/main.c
          cmake-format --check CMakeLists.txt
          yamllint .github/workflows/ci.yml

      - name: Init submodules
        run: |
          git submodule update --init --depth 1 \
            third_party/flatcc \
            third_party/rv32emu
          git -C third_party/rv32emu submodule update --init --depth 1 \
            src/softfloat

      - name: Stamp version
        run: |
          mkdir -p build
          VERSION=$(cat version.txt)
          if [[ "$VERSION" == *-dev ]]; then
            echo "${VERSION}-$(date +%Y%m%d-%H%M%S)" > build/version.txt
          else
            cp version.txt build/version.txt
          fi
          echo "BLYT_VERSION=$(cat build/version.txt)" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: cmake -B build -G Ninja

      - name: Build
        run: cmake --build build

      - name: C unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path devtool/Cargo.toml --all

      - name: Rust tests (unit + integration)
        env:
          BLYT_SDK_DIR: ${{ github.workspace }}
          BLYT_OBJCOPY: llvm-objcopy
        run: cargo test --manifest-path devtool/Cargo.toml --workspace
