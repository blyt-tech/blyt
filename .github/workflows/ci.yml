name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux-x86-64:
    name: Linux x86-64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # Add LLVM 22 apt repo (ubuntu-24.04 ships clang-18 by default)
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /etc/apt/keyrings/apt.llvm.org.gpg
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.gpg] \
            https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsdl2-dev \
            clang-22 lld-22 llvm-22 lldb-22 \
            qemu-system-misc gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            libc6-dev-riscv64-cross libgcc-s1-riscv64-cross
          sudo update-alternatives --install /usr/bin/clang        clang        /usr/bin/clang-22        100
          sudo update-alternatives --install /usr/bin/clang++       clang++       /usr/bin/clang++-22       100
          sudo update-alternatives --install /usr/bin/ld.lld        ld.lld        /usr/bin/ld.lld-22        100
          sudo update-alternatives --install /usr/bin/llvm-objcopy  llvm-objcopy  /usr/bin/llvm-objcopy-22  100
          sudo update-alternatives --install /usr/bin/llvm-ar       llvm-ar       /usr/bin/llvm-ar-22       100
          sudo update-alternatives --install /usr/bin/lldb-dap      lldb-dap      /usr/bin/lldb-dap-22      100
          pip3 install clang-format==22.1.5 cmakelang yamllint
          # Cart Rust builds use -Z build-std (nightly + rust-src) to recompile
          # core/alloc as PIC for the PIE cart ELF (ADR-0108). The host devtool
          # still builds on stable. Keep this dated nightly in sync with
          # CART_RUST_TOOLCHAIN in devtool/src/build.rs.
          rustup toolchain install nightly-2026-06-01 --profile minimal --component rust-src
          # The Rust-cart integration tests gate on the riscv32 target being
          # installed (has_rust_riscv_target); add it to stable to match
          # Dockerfile.testing. (build-std supplies std from source; this just
          # satisfies the test's availability check.)
          rustup target add riscv32imafc-unknown-none-elf

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Init submodules
        run: |
          git submodule update --init --depth 1 \
            third_party/flatcc \
            third_party/rv32emu \
            third_party/musl \
            third_party/libretro-common \
            third_party/libcxx \
            third_party/lua
          git -C third_party/rv32emu submodule update --init --depth 1 \
            src/softfloat

      - name: Stamp version
        run: |
          mkdir -p build
          VERSION=$(cat version.txt)
          if [[ "$VERSION" == *-dev ]]; then
            echo "${VERSION}-$(date +%Y%m%d-%H%M%S)" > build/version.txt
          else
            cp version.txt build/version.txt
          fi
          echo "BLYT_VERSION=$(cat build/version.txt)" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: cmake -B build -G Ninja

      # The lint target is the single source of truth for the format checks
      # (clang-format, cmake-format, yamllint, cargo fmt). It needs a
      # configured build tree, hence runs after Configure.
      - name: Lint
        run: cmake --build build --target lint

      - name: Build
        # Builds both player variants: blytplay (release) and blytdebug (debug,
        # GDB/DAP) — ADR-0129.
        run: cmake --build build

      - name: C unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Build SDK
        # Guest libs (release + debug + native) are already built into sdk/
        # by the Build step (ninja rules); this adds both libc++ variants,
        # headers, the devtool, and both WASM runtimes (share/wasm +
        # share/wasm-debug). The debug libc++ build roughly doubles SDK build
        # time; kept in this step for now (ADR-0129).
        run: cmake --build build --target sdk

      - name: Cross-compile blyt_native for riscv64
        run: |
          cmake -B build-riscv64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/riscv64-linux-gnu.cmake \
            "-DBLYT_PREGENERATED_DIR=$PWD/build/generated/flatbuffers"
          cmake --build build-riscv64 --target blyt_native

      - name: Download QEMU ILP32 test image
        env:
          QEMU_IMAGE_URL: ${{ vars.BLYT_QEMU_IMAGE_URL }}
        run: |
          if [ -z "$QEMU_IMAGE_URL" ]; then
            echo "::warning::BLYT_QEMU_IMAGE_URL not set — native QEMU gate will be skipped"
            exit 0
          fi
          mkdir -p /tmp/blyt-qemu
          curl -fsSL "$QEMU_IMAGE_URL/kernel"       -o /tmp/blyt-qemu/Image
          curl -fsSL "$QEMU_IMAGE_URL/rootfs.qcow2" -o /tmp/blyt-qemu/rootfs.qcow2
          curl -fsSL "$QEMU_IMAGE_URL/id_ed25519"   -o /tmp/blyt-qemu/id_ed25519
          chmod 600 /tmp/blyt-qemu/id_ed25519

      - name: Native RISC-V ILP32 gate
        if: vars.BLYT_QEMU_IMAGE_URL != ''
        timeout-minutes: 10
        env:
          BLYT_QEMU_KERNEL: /tmp/blyt-qemu/Image
          BLYT_QEMU_ROOTFS: /tmp/blyt-qemu/rootfs.qcow2
          BLYT_QEMU_SSH_KEY: /tmp/blyt-qemu/id_ed25519
          BLYT_BUILD_DIR: ${{ github.workspace }}/build
          BLYT_SDK_DIR: ${{ github.workspace }}/build/sdk
          BLYT_OBJCOPY: llvm-objcopy
        run: |
          cargo test \
            --manifest-path tests/integration/Cargo.toml \
            -- native_riscv_qemu_gate --nocapture

      - name: Install Playwright
        run: |
          cd tests/wasm
          npm install
          npx playwright install --with-deps chromium

      - name: Rust tests (unit + integration)
        timeout-minutes: 20
        env:
          BLYT_BUILD_DIR: ${{ github.workspace }}/build
        run: |
          cargo build -p blyt
          cargo test --workspace

      # Build every example cart with the assembled SDK to validate that the
      # examples stay buildable. Runs last so it gates on a working SDK. The
      # SDK-installed blyt auto-discovers its tools (blyt-clang, blyt-luac, …)
      # and the pinned nightly for Rust carts. All examples are attempted so
      # every failure is reported, then the step fails if any did not build.
      - name: Build examples
        env:
          BLYT_SDK_DIR: ${{ github.workspace }}/build/sdk
        run: |
          failed=()
          for ex in examples/*/; do
            [ -f "${ex}blyt.info.yaml" ] || continue
            name="${ex%/}"
            echo "::group::blyt build ${name}"
            if build/sdk/bin/blyt build "${ex}"; then
              echo "ok: ${name}"
            else
              echo "::error::example failed to build: ${name}"
              failed+=("${name}")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -ne 0 ]; then
            echo "Examples failed to build: ${failed[*]}"
            exit 1
          fi

      # Run every built example for 10 frames and assert the expected output.
      # All carts emit the same three lines (same Player state, same cadence).
      - name: Smoke-test examples
        run: |
          failed=()
          expected=(
            "init player pos: 160, 120"
            "update frame 10 player pos: 161, 121"
            "draw frame 10 player pos: 161, 121"
          )
          for ex in examples/*/; do
            [ -f "${ex}blyt.info.yaml" ] || continue
            name="${ex%/}"
            cart="${ex}build/$(basename "${name}").blyt"
            echo "::group::smoke ${name}"
            out=$(build/sdk/bin/blytplay --headless --quit-after 10 "${cart}" 2>&1)
            ok=true
            for line in "${expected[@]}"; do
              if ! printf '%s' "${out}" | grep -qF "${line}"; then
                echo "::error::${name}: missing: ${line}"
                ok=false
              fi
            done
            out_ns=$(build/sdk/bin/blytplay --headless --reset-every-frame --quit-after 10 "${cart}" 2>&1)
            for line in "${expected[@]}"; do
              if ! printf '%s' "${out_ns}" | grep -qF "${line}"; then
                echo "::error::${name} (--reset-every-frame): missing: ${line}"
                ok=false
              fi
            done
            if ${ok}; then
              echo "ok: ${name}"
            else
              failed+=("${name}")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -ne 0 ]; then
            echo "Example smoke tests failed: ${failed[*]}"
            exit 1
          fi
