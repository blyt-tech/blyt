name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux-x86-64:
    name: Linux x86-64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build flatbuffers-compiler

      - name: Stamp version
        run: |
          mkdir -p build
          VERSION=$(cat version.txt)
          if [[ "$VERSION" == *-dev ]]; then
            echo "${VERSION}-$(date +%Y%m%d-%H%M%S)" > build/version.txt
          else
            cp version.txt build/version.txt
          fi
          echo "BLYT_VERSION=$(cat build/version.txt)" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: cmake -B build -G Ninja

      - name: Build
        run: cmake --build build

      - name: Build blytbuild
        run: cargo build --manifest-path blytbuild/Cargo.toml --workspace
