name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux-x86-64:
    name: Linux x86-64
    runs-on: ubuntu-latest

    env:
      # Back sccache (cart build-std compiles, via the devtool's
      # RUSTC_WRAPPER) with the GitHub Actions cache.
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # Add LLVM 22 apt repo (ubuntu-24.04 ships clang-18 by default)
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /etc/apt/keyrings/apt.llvm.org.gpg
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.gpg] \
            https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsdl2-dev xvfb \
            clang-22 lld-22 llvm-22 lldb-22 \
            qemu-system-misc gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            libc6-dev-riscv64-cross libgcc-s1-riscv64-cross \
            lua-check
          # libc6-dev-riscv64-cross ships stubs-ilp32f.h but not stubs-ilp32d.h.
          # Clang still resolves gnu/stubs.h through the riscv64-linux-gnu sysroot
          # when building ILP32D guest code; an empty stub is sufficient since
          # libc is never linked (matches the fix already in Dockerfile.testing).
          sudo mkdir -p /usr/riscv64-linux-gnu/include/gnu
          sudo touch /usr/riscv64-linux-gnu/include/gnu/stubs-ilp32d.h
          sudo update-alternatives --install /usr/bin/clang        clang        /usr/bin/clang-22        100
          sudo update-alternatives --install /usr/bin/clang++       clang++       /usr/bin/clang++-22       100
          sudo update-alternatives --install /usr/bin/ld.lld        ld.lld        /usr/bin/ld.lld-22        100
          sudo update-alternatives --install /usr/bin/llvm-objcopy  llvm-objcopy  /usr/bin/llvm-objcopy-22  100
          sudo update-alternatives --install /usr/bin/llvm-ar       llvm-ar       /usr/bin/llvm-ar-22       100
          sudo update-alternatives --install /usr/bin/lldb-dap      lldb-dap      /usr/bin/lldb-dap-22      100
          pip3 install clang-format==22.1.5 cmakelang yamllint
          # Align stable Rust to the latest release: the runner-image rollout
          # leaves different preinstalled stable versions on different
          # runners (observed 1.95 vs 1.96 across consecutive runs), and
          # rust-cache keys on the rustc version — flapping versions made
          # every restore miss ("No cache found").
          rustup update stable
          # Cart Rust builds use -Z build-std (nightly + rust-src) to recompile
          # core/alloc as PIC for the PIE cart ELF (ADR-0108). The host devtool
          # still builds on stable. Keep this dated nightly in sync with
          # CART_RUST_TOOLCHAIN in devtool/src/build.rs.
          rustup toolchain install nightly-2026-06-01 --profile minimal --component rust-src
          # has_rust_riscv_target() checks for this toolchain by name.
          # Cart builds use a custom JSON target (riscv32imafdc-blyt-none-elf)
          # via -Z build-std, so no rustup target add is needed or meaningful.

      # v16: v14's cache client predates the cache-service-v2 migration and
      # fails with HTTP 400, so every run reinstalled emsdk into a random
      # ${{ runner.temp }}/<uuid>/ dir — and because the emcc path and
      # sysroot include paths are ccache inputs, every WASM TU missed the
      # compiler cache on every run (~650 misses). A working emsdk cache
      # installs into the stable emsdk-cache/ folder. Version pinned so
      # emsdk bumps are deliberate (an upgrade invalidates the WASM cache).
      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.0
          actions-cache-folder: emsdk-cache

      # Compiler caches, persisted in the GitHub Actions cache. ccache is
      # picked up automatically at CMake configure time
      # (cmake/blyt_ccache.cmake) and covers the host build, both libc++
      # trees, both WASM trees, and the riscv64 cross build. sccache is
      # picked up by the blyt devtool (RUSTC_WRAPPER) for cart rustc
      # invocations, so the -Z build-std core/alloc recompile is cached
      # across the example carts and across runs. rust-cache covers the
      # host cargo workspace (registry + target/).
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-clang22
          max-size: 1.5G

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # nextest runs the workspace's test binaries in parallel (cargo test
      # executes them serially); the integration suites are dominated by
      # waiting on spawned players/drivers, so cross-suite parallelism is a
      # large win. Prebuilt binary install (~2s).
      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Install stylua
        uses: taiki-e/install-action@v2
        with:
          tool: stylua@2.5.2

      # Deps are downloaded via CMake FetchContent at configure time into
      # ~/.cache/blyt/fetchcontent/. Cache the directory keyed on a hash of
      # CMakeLists.txt (which contains all URLs and SHA256 values); a dep
      # version bump automatically invalidates the cache. No restore-keys
      # fallback: a partial restore of a previous cache serves stale extracted
      # source trees that FetchContent reuses without re-downloading.
      - name: FetchContent cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/blyt/fetchcontent
          key: fetchcontent-${{ hashFiles('CMakeLists.txt') }}

      - name: Stamp version
        run: |
          mkdir -p build
          VERSION=$(cat version.txt)
          if [[ "$VERSION" == *-dev ]]; then
            echo "${VERSION}-$(date +%Y%m%d-%H%M%S)" > build/version.txt
          else
            cp version.txt build/version.txt
          fi
          echo "BLYT_VERSION=$(cat build/version.txt)" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: cmake -B build -G Ninja

      # The lint target is the single source of truth for the format checks
      # (clang-format, cmake-format, yamllint, cargo fmt, biome). It needs a
      # configured build tree, hence runs after Configure.
      - name: Lint
        run: cmake --build build --target lint

      - name: Build
        # Builds both player variants: blytplay (release) and blytdebug (debug,
        # GDB/DAP) — ADR-0129.
        run: cmake --build build

      - name: Unit tests
        run: cmake --build build --target test-unit

      - name: Build SDK
        # Guest libs (release + debug + native) are already built into sdk/
        # by the Build step (ninja rules); this adds both libc++ variants,
        # headers, the devtool, and both WASM runtimes (share/wasm +
        # share/wasm-debug). The debug libc++ build roughly doubles SDK build
        # time; kept in this step for now (ADR-0129).
        run: cmake --build build --target sdk

      - name: Cross-compile blyt_native for riscv64
        run: |
          cmake -B build-riscv64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/riscv64-linux-gnu.cmake \
            "-DBLYT_PREGENERATED_DIR=$PWD/build/generated/flatbuffers"
          cmake --build build-riscv64 --target blyt_native

      - name: Download QEMU ILP32 test image
        env:
          QEMU_IMAGE_URL: ${{ vars.BLYT_QEMU_IMAGE_URL }}
        run: |
          if [ -z "$QEMU_IMAGE_URL" ]; then
            echo "::warning::BLYT_QEMU_IMAGE_URL not set — native QEMU gate will be skipped"
            exit 0
          fi
          mkdir -p /tmp/blyt-qemu
          curl -fsSL "$QEMU_IMAGE_URL/kernel"       -o /tmp/blyt-qemu/Image
          curl -fsSL "$QEMU_IMAGE_URL/rootfs.qcow2" -o /tmp/blyt-qemu/rootfs.qcow2
          curl -fsSL "$QEMU_IMAGE_URL/id_ed25519"   -o /tmp/blyt-qemu/id_ed25519
          chmod 600 /tmp/blyt-qemu/id_ed25519

      # Cache the Playwright chromium download keyed on the pinned playwright
      # version (lockfile); --with-deps still apt-installs the few system
      # libs but skips the browser download on a hit.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('tests/wasm/package-lock.json') }}

      - name: Install Playwright
        run: |
          cmake --build build --target wasm_test_deps
          cd tests/wasm && npx playwright install --with-deps chromium

      # The QEMU native ILP32 gate runs inside this step as a regular test:
      # nextest overlaps its ~30s QEMU boot with the other suites. The
      # BLYT_QEMU_* env points at the files downloaded above — when
      # BLYT_QEMU_IMAGE_URL is unset they don't exist and the gate skips.
      # BLYT_BUILD_DIR is injected by the CMake target via cmake -E env.
      - name: Integration tests
        timeout-minutes: 20
        env:
          BLYT_QEMU_KERNEL: /tmp/blyt-qemu/Image
          BLYT_QEMU_ROOTFS: /tmp/blyt-qemu/rootfs.qcow2
          BLYT_QEMU_SSH_KEY: /tmp/blyt-qemu/id_ed25519
        run: cmake --build build --target test-integration

      # VS Code extension unit tests (cart-detection helpers + the lldb-proxy
      # breakpoint logic). Cheap: run via node's built-in test runner. The
      # npm install here also provides the devDeps the integration step needs.
      - name: VS Code extension tests
        run: |
          cd tools/vscode
          npm install
          npm test

      # Cache the @vscode/test-electron download (a pinned VS Code build).
      # Keyed on the version pinned in test/integration/runTests.js.
      - name: Cache VS Code test build
        uses: actions/cache@v4
        with:
          path: tools/vscode/.vscode-test
          key: vscode-test-1.125.1

      # End-to-end debugger tests that drive real blyt debug sessions through
      # the extension in a headless VS Code (test/integration). Needs the SDK
      # (built above) and a display: blytdebug opens an SDL2 window and Electron
      # needs a renderer, so wrap the run in xvfb.
      - name: VS Code debugger integration tests
        env:
          BLYT_SDK_DIR: ${{ github.workspace }}/build/sdk
        run: |
          cd tools/vscode
          xvfb-run -a npm run test:integration

      # Build every example cart with the assembled SDK to validate that the
      # examples stay buildable. Runs last so it gates on a working SDK. The
      # SDK-installed blyt auto-discovers its tools (blyt-clang, blyt-luac, …)
      # and the pinned nightly for Rust carts. All examples are attempted so
      # every failure is reported, then the step fails if any did not build.
      - name: Build examples
        env:
          BLYT_SDK_DIR: ${{ github.workspace }}/build/sdk
        run: |
          failed=()
          for ex in examples/*/; do
            [ -f "${ex}blyt.info.yaml" ] || continue
            name="${ex%/}"
            echo "::group::blyt build ${name}"
            if build/sdk/bin/blyt build "${ex}"; then
              echo "ok: ${name}"
            else
              echo "::error::example failed to build: ${name}"
              failed+=("${name}")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -ne 0 ]; then
            echo "Examples failed to build: ${failed[*]}"
            exit 1
          fi

      # Run every built example for 10 frames and assert the expected output.
      # All carts emit the same three lines (same Character state, same cadence).
      - name: Smoke-test examples
        run: |
          failed=()
          expected=(
            "init player pos: 160, 120"
            "update frame 10 player pos: 161, 121"
            "draw frame 10 player pos: 161, 121"
          )
          for ex in examples/*/; do
            [ -f "${ex}blyt.info.yaml" ] || continue
            name="${ex%/}"
            cart="${ex}build/$(basename "${name}").blyt"
            echo "::group::smoke ${name}"
            out=$(build/sdk/bin/blytplay --headless --quit-after 10 "${cart}" 2>&1)
            ok=true
            for line in "${expected[@]}"; do
              if ! printf '%s' "${out}" | grep -qF "${line}"; then
                echo "::error::${name}: missing: ${line}"
                ok=false
              fi
            done
            out_ns=$(build/sdk/bin/blytplay --headless --reset-every-frame --quit-after 10 "${cart}" 2>&1)
            for line in "${expected[@]}"; do
              if ! printf '%s' "${out_ns}" | grep -qF "${line}"; then
                echo "::error::${name} (--reset-every-frame): missing: ${line}"
                ok=false
              fi
            done
            if ${ok}; then
              echo "ok: ${name}"
            else
              failed+=("${name}")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -ne 0 ]; then
            echo "Example smoke tests failed: ${failed[*]}"
            exit 1
          fi
