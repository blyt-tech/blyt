<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>blyt</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
        font-family: monospace;
        color: #ccc;
      }
      #canvas {
        /* Fill the iframe viewport (sized to 4:3 by the outer wrapper). */
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #status {
        position: absolute;
        bottom: 8px;
        left: 0; right: 0;
        text-align: center;
        font-size: 12px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" width="320" height="240"></canvas>
    <div id="status">Loading…</div>

    <script>
      /* Relay ports injected by `blyt run --debug`.  0 when debugging is not active. */
      window.blyt_dap_port = {{BLYT_DAP_PORT}};
      window.blyt_gdb_port = {{BLYT_GDB_PORT}};
      /* Dev control relay port (issue #87) — injected in project-dir mode, 0
       * otherwise.  Carries runtime lifecycle commands (reload/save/load/reset)
       * over a WebSocket to the devtool's relay (PORT+5). */
      window.blyt_dev_ctrl_port = {{BLYT_DEV_CTRL_PORT}};
      /* Trace channels injected by `blyt run/debug --trace` ("" when off).
       * module_pre.js copies __blyt_env_vars into the Emscripten ENV before C
       * startup, so the runtime's getenv("BLYT_TRACE") sees the channels.
       * Lives in this script block on purpose: when the template is loaded
       * without replacement, the port lines above are a syntax error and the
       * whole block (including this) is inert. */
      if ("{{BLYT_TRACE}}") {
        globalThis.__blyt_env_vars = Object.assign(globalThis.__blyt_env_vars || {}, {
          BLYT_TRACE: "{{BLYT_TRACE}}",
        });
      }
    </script>
    <script>
      /* Dev control channel (issue #87).  Opens a WebSocket to the devtool's
       * relay and bridges newline-delimited JSON lifecycle commands to/from the
       * C runtime:
       *   inbound  command line → Module.ccall("blyt_dev_ctrl_command", …)
       *   outbound response     → globalThis.blyt_dev_ctrl_send (called from C)
       * Reload re-fetches the freshly rebuilt cart into MEMFS, then hands back
       * to C via blyt_dev_ctrl_reload_fetched (ADR-0045 sequence). */
      function blyt_dev_ctrl_connect(Module, port) {
        var ws = new WebSocket("ws://127.0.0.1:" + port + "/");
        ws.onmessage = function (e) {
          Module.ccall("blyt_dev_ctrl_command", null, ["string"], [e.data]);
        };
        ws.onerror = function (e) {
          console.error("[blyt] dev control socket error:", e);
        };
        globalThis.blyt_dev_ctrl_send = function (json) {
          if (ws.readyState === WebSocket.OPEN) ws.send(json);
        };
        globalThis.blyt_dev_ctrl_fetch_cart = function () {
          fetch("cart.blyt")
            .then(function (r) {
              if (!r.ok) throw new Error("HTTP " + r.status);
              return r.arrayBuffer();
            })
            .then(function (buf) {
              FS.writeFile("/cart.blyt", new Uint8Array(buf));
              Module.ccall("blyt_dev_ctrl_reload_fetched", null, ["int"], [1]);
            })
            .catch(function (e) {
              console.error("[blyt] dev control reload fetch failed:", e);
              Module.ccall("blyt_dev_ctrl_reload_fetched", null, ["int"], [0]);
            });
        };
      }
    </script>
    <script>
      /* Pre-load the cart into the Emscripten virtual filesystem before
       * main() runs.  The cart is served as /cart.blyt by `blyt run`
       * alongside this page.
       *
       * addRunDependency / removeRunDependency delay Emscripten's main()
       * call until the async fetch completes. */
      var Module = {
        canvas: document.getElementById("canvas"),

        preRun: [
          function () {
            Module.addRunDependency("blyt-cart");
            fetch("cart.blyt")
              .then(function (r) {
                if (!r.ok) throw new Error("HTTP " + r.status);
                return r.arrayBuffer();
              })
              .then(function (buf) {
                FS.writeFile("/cart.blyt", new Uint8Array(buf));
                document.getElementById("status").textContent = "Running…";
                Module.removeRunDependency("blyt-cart");
              })
              .catch(function (e) {
                document.getElementById("status").textContent =
                  "Cart load failed: " + e;
                console.error("[blyt] cart load failed:", e);
                Module.removeRunDependency("blyt-cart");
              });
          },
        ],

        onRuntimeInitialized: function () {
          /* main() has been called; loop is running via emscripten_set_main_loop */
          if (window.blyt_dev_ctrl_port > 0) {
            blyt_dev_ctrl_connect(Module, window.blyt_dev_ctrl_port);
          }
        },

        print: function (text) {
          console.log(text);
        },
        printErr: function (text) {
          console.error(text);
        },
      };
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
