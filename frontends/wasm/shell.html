<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>blyt</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
        font-family: monospace;
        color: #ccc;
      }
      #canvas {
        /* Fill the iframe viewport (sized to 4:3 by the outer wrapper). */
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #status {
        position: absolute;
        bottom: 8px;
        left: 0; right: 0;
        text-align: center;
        font-size: 12px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" width="320" height="240"></canvas>
    <div id="status">Loading…</div>

    <script>
      /* Relay ports injected by `blyt run --debug`.  0 when debugging is not active. */
      window.blyt_dap_port = {{BLYT_DAP_PORT}};
      window.blyt_gdb_port = {{BLYT_GDB_PORT}};
    </script>
    <script>
      /* Pre-load the cart into the Emscripten virtual filesystem before
       * main() runs.  The cart is served as /cart.blyt by `blyt run`
       * alongside this page.
       *
       * addRunDependency / removeRunDependency delay Emscripten's main()
       * call until the async fetch completes. */
      var Module = {
        canvas: document.getElementById("canvas"),

        preRun: [
          function () {
            Module.addRunDependency("blyt-cart");
            fetch("cart.blyt")
              .then(function (r) {
                if (!r.ok) throw new Error("HTTP " + r.status);
                return r.arrayBuffer();
              })
              .then(function (buf) {
                FS.writeFile("/cart.blyt", new Uint8Array(buf));
                document.getElementById("status").textContent = "Running…";
                Module.removeRunDependency("blyt-cart");
              })
              .catch(function (e) {
                document.getElementById("status").textContent =
                  "Cart load failed: " + e;
                console.error("[blyt] cart load failed:", e);
                Module.removeRunDependency("blyt-cart");
              });
          },
        ],

        onRuntimeInitialized: function () {
          /* main() has been called; loop is running via emscripten_set_main_loop */
        },

        print: function (text) {
          console.log(text);
        },
        printErr: function (text) {
          console.error(text);
        },
      };
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
