<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>blyt</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
        font-family: monospace;
        color: #ccc;
      }
      #canvas {
        /* Fill the iframe viewport (sized to 4:3 by the outer wrapper). */
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #status {
        position: absolute;
        bottom: 8px;
        left: 0; right: 0;
        text-align: center;
        font-size: 12px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" width="320" height="240"></canvas>
    <div id="status">Loading…</div>

    <script>
      /* Relay ports injected by `blyt run --debug`.  0 when debugging is not active. */
      window.blyt_dap_port = {{BLYT_DAP_PORT}};
      window.blyt_gdb_port = {{BLYT_GDB_PORT}};
      /* Host path of the debug cart ELF, so lldb-dap can open it locally to read
       * the cart's DWARF (issue #144).  "" when not debugging. */
      window.blyt_cart_path = "{{BLYT_CART_PATH}}";
      /* Dev control relay port (issue #87) — injected in project-dir mode, 0
       * otherwise.  Carries runtime lifecycle commands (reload/save/load/reset)
       * over a WebSocket to the devtool's relay (PORT+5). */
      window.blyt_dev_ctrl_port = {{BLYT_DEV_CTRL_PORT}};
      /* Trace channels injected by `blyt run/debug --trace` ("" when off).
       * module_pre.js copies __blyt_env_vars into the Emscripten ENV before C
       * startup, so the runtime's getenv("BLYT_TRACE") sees the channels.
       * Lives in this script block on purpose: when the template is loaded
       * without replacement, the port lines above are a syntax error and the
       * whole block (including this) is inert. */
      if ("{{BLYT_TRACE}}") {
        globalThis.__blyt_env_vars = Object.assign(globalThis.__blyt_env_vars || {}, {
          BLYT_TRACE: "{{BLYT_TRACE}}",
        });
      }
      /* Point the host's dev-mode resource loader at the MEMFS dir the preload
       * below materialises (issue #118).  Set synchronously here so module_pre's
       * ENV hook copies it into the C environment before startup.  Harmless for
       * packed carts: embedded .cart.resource sections win and the dir is unused. */
      globalThis.__blyt_env_vars = Object.assign(globalThis.__blyt_env_vars || {}, {
        BLYT_RESOURCE_DIR: "/blyt_resources",
      });
</script>
    <script>
      /* Materialise the content-addressed resource staging dir into MEMFS (issue
       * #118), mirroring the native layout the host reads via BLYT_RESOURCE_DIR:
       *   /blyt_resources/resource-id-index
       *   /blyt_resources/resources/<name>-<fp>.data
       * Fetches the index, then any referenced file not already present (content
       * hash = immutable, so a present file is the right version), prunes
       * superseded files no longer referenced, and writes the refreshed index.
       * Returns false when there is no index (e.g. a packed cart) so callers can
       * treat dev resources as absent.  Shared by the initial preload and the
       * update_assets refetch. */
      const BLYT_RESOURCE_DIR = "/blyt_resources";
      async function blyt_materialise_resources() {
        const r = await fetch("resource-id-index");
        if (!r.ok) return false;
        const indexText = await r.text();
        const rels = [];
        for (const line of indexText.split("\n")) {
          const sp = line.indexOf(" ");
          if (sp < 0) continue;
          const rel = line.slice(sp + 1).trim();
          if (rel) rels.push(rel);
        }
        FS.mkdirTree(BLYT_RESOURCE_DIR + "/resources");
        for (const rel of rels) {
          const dst = BLYT_RESOURCE_DIR + "/" + rel;
          let have = false;
          try {
            FS.stat(dst);
            have = true;
          } catch (e) {
            /* not present */
          }
          if (!have) {
            const fr = await fetch(rel);
            if (!fr.ok) throw new Error("fetch " + rel + " -> HTTP " + fr.status);
            FS.writeFile(dst, new Uint8Array(await fr.arrayBuffer()));
          }
        }
        /* Prune superseded staging files the refreshed index no longer references
         * (mirrors the devtool's on-disk GC; safe because the host copies bytes
         * into its own buffers on reload). */
        const keep = new Set(rels.map((x) => x.replace(/^resources\//, "")));
        try {
          for (const name of FS.readdir(BLYT_RESOURCE_DIR + "/resources")) {
            if (name === "." || name === "..") continue;
            if (!keep.has(name)) FS.unlink(BLYT_RESOURCE_DIR + "/resources/" + name);
          }
        } catch (e) {
          /* dir absent — nothing to prune */
        }
        FS.writeFile(BLYT_RESOURCE_DIR + "/resource-id-index", indexText);
        return true;
      }
    </script>
    <script>
      /* Dev control channel (issue #87).  Opens a WebSocket to the devtool's
       * relay and bridges newline-delimited JSON lifecycle commands to/from the
       * C runtime:
       *   inbound  command line → Module.ccall("blyt_dev_ctrl_command", …)
       *   outbound response     → globalThis.blyt_dev_ctrl_send (called from C)
       * Reload re-fetches the freshly rebuilt cart into MEMFS, then hands back
       * to C via blyt_dev_ctrl_reload_fetched (ADR-0045 sequence). */
      function blyt_dev_ctrl_connect(Module, port) {
        var ws = new WebSocket("ws://127.0.0.1:" + port + "/");
        ws.onmessage = function (e) {
          Module.ccall("blyt_dev_ctrl_command", null, ["string"], [e.data]);
        };
        ws.onerror = function (e) {
          console.error("[blyt] dev control socket error:", e);
        };
        globalThis.blyt_dev_ctrl_send = function (json) {
          if (ws.readyState === WebSocket.OPEN) ws.send(json);
        };
        globalThis.blyt_dev_ctrl_fetch_cart = function () {
          fetch("cart.blyt")
            .then(function (r) {
              if (!r.ok) throw new Error("HTTP " + r.status);
              return r.arrayBuffer();
            })
            .then(function (buf) {
              FS.writeFile("/cart.blyt", new Uint8Array(buf));
              Module.ccall("blyt_dev_ctrl_reload_fetched", null, ["int"], [1]);
            })
            .catch(function (e) {
              console.error("[blyt] dev control reload fetch failed:", e);
              Module.ccall("blyt_dev_ctrl_reload_fetched", null, ["int"], [0]);
            });
        };
        /* update_assets (issue #118): refresh the MEMFS resource staging dir,
         * then hand back to C to reload the host resource table. */
        globalThis.blyt_dev_ctrl_fetch_resources = function () {
          blyt_materialise_resources()
            .then(function (ok) {
              Module.ccall("blyt_dev_ctrl_assets_fetched", null, ["int"], [ok ? 1 : 0]);
            })
            .catch(function (e) {
              console.error("[blyt] dev control resource refetch failed:", e);
              Module.ccall("blyt_dev_ctrl_assets_fetched", null, ["int"], [0]);
            });
        };
      }
    </script>
    <script>
      /* Pre-load the cart into the Emscripten virtual filesystem before
       * main() runs.  The cart is served as /cart.blyt by `blyt run`
       * alongside this page.
       *
       * addRunDependency / removeRunDependency delay Emscripten's main()
       * call until the async fetch completes. */
      var Module = {
        canvas: document.getElementById("canvas"),

        preRun: [
          function () {
            Module.addRunDependency("blyt-cart");
            fetch("cart.blyt")
              .then(function (r) {
                if (!r.ok) throw new Error("HTTP " + r.status);
                return r.arrayBuffer();
              })
              .then(function (buf) {
                FS.writeFile("/cart.blyt", new Uint8Array(buf));
                document.getElementById("status").textContent = "Running…";
                Module.removeRunDependency("blyt-cart");
              })
              .catch(function (e) {
                document.getElementById("status").textContent =
                  "Cart load failed: " + e;
                console.error("[blyt] cart load failed:", e);
                Module.removeRunDependency("blyt-cart");
              });
          },
          /* Preload the content-addressed resource staging dir into MEMFS before
           * main() so the host's dev-mode resource loader (BLYT_RESOURCE_DIR) sees
           * it at session creation (issue #118).  404-tolerant: a packed cart has
           * no index, so this no-ops and embedded sections are used instead. */
          function () {
            Module.addRunDependency("blyt-resources");
            blyt_materialise_resources()
              .catch(function (e) {
                console.error("[blyt] resource preload failed:", e);
              })
              .finally(function () {
                Module.removeRunDependency("blyt-resources");
              });
          },
        ],

        onRuntimeInitialized: function () {
          /* main() has been called; loop is running via emscripten_set_main_loop */
          if (window.blyt_dev_ctrl_port > 0) {
            blyt_dev_ctrl_connect(Module, window.blyt_dev_ctrl_port);
          }
        },

        print: function (text) {
          console.log(text);
        },
        printErr: function (text) {
          console.error(text);
        },
      };
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
